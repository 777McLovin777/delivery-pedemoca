name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Biome
        if: github.event_name == 'pull_request'
        run: npx biome lint --changed --since=${{ github.event.pull_request.base.sha }} --no-errors-on-unmatched .

      - name: Knip
        run: npm run knip

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
